[package]
name = "sgpt"
version = "0.5.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
axum = "0.8"
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
hex = "0.4"
http = "1.4"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "socks"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tempfile = "3.27"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "signal", "time"] }
url = "2.5"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
